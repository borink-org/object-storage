name: typescript

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  # The TypeScript client in `typescript`: its types, its build, and the
  # recorded S3 cases of borink-org/object-tests, graded in Bun and in workerd.
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install the pinned Rust toolchain, which builds the grader
        run: rustup toolchain install
        working-directory: .
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: object-tests/grade.sh
