name: azure-live
# This suite spends the storage account, so opening a pull request must not be
# enough to run it. The `azure-live` environment requires a reviewer: a run
# waits for that approval before it gets a token, and until then it is a
# pending check, which blocks the merge.
#
# A pull request from a fork is given no `id-token` permission whatever the
# reviewer says, so the job fails there rather than passing untested. Push the
# branch to this repository to have it run.
#
# The job runs `tests/azure-live/run.sh`, the same script that runs the suite
# on a workstation. It gets its token from `tests/azure-setup/token.sh`, which
# in Actions exchanges the job's OIDC token for one of the workflow identity.
# Nothing else is decided here: `tests/azure-setup/identities.env` names the
# tenant and the identity, and `tests/support/src/azure.rs` the accounts.
on:
  workflow_dispatch:
  pull_request:
# A run waiting for its reviewer counts as in progress, so without
# `cancel-in-progress` every new run on a branch would queue behind the last
# one. With it, a new run cancels the branch's earlier run, approved or not,
# and leaves one run for the newest commit.
concurrency:
  group: azure-live-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  id-token: write
jobs:
  # One job per account, because the two behave differently and each run of
  # the suite is against one of them. Each job owns its own keys on its own
  # account, so the two run at the same time.
  test:
    runs-on: ubuntu-latest
    environment: azure-live
    strategy:
      fail-fast: false
      matrix:
        account: [flat, hierarchical]
    name: test (${{ matrix.account }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      - run: tests/azure-live/run.sh ${{ matrix.account }}
