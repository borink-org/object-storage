name: azure-live
on:
  workflow_dispatch:
# A run waiting for its reviewer counts as in progress, so without
# `cancel-in-progress` every new run on a branch would queue behind the last
# one. With it, a new run cancels the branch's earlier run, approved or not,
# and leaves one run for the newest commit.
concurrency:
  group: azure-live-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  id-token: write
env:
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_STORAGE_ENDPOINT: https://borinkstoragetest.blob.core.windows.net
  AZURE_STORAGE_CONTAINER: borink-object-test
  AZURE_BLOB_KEY: borink-object-storage/azure-get-reference/a key+é.txt
  # The write tests own this key and overwrite it on every run. It must never
  # be the read reference above, whose contents the read tests assert.
  AZURE_PUT_KEY: borink-object-storage/azure-put-scratch/a key+é.bin
jobs:
  test:
    runs-on: ubuntu-latest
    environment: azure-live
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      - name: Log in to Azure
        run: |
          OIDC_TOKEN="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api%3A%2F%2FAzureADTokenExchange" | jq -er .value)"
          az login --service-principal --username "$AZURE_CLIENT_ID" --tenant "$AZURE_TENANT_ID" --federated-token "$OIDC_TOKEN"
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
      - name: Test Azure live
        run: |
          TOKEN="$(az account get-access-token --resource https://storage.azure.com/ --query accessToken --output tsv)"
          echo "::add-mask::$TOKEN"
          export AZURE_STORAGE_ACCESS_TOKEN="$TOKEN"
          cargo test --locked -p azure-live -- --ignored --test-threads=1
