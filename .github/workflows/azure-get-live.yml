name: azure-get-live

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  BORINK_AZURE_ACCOUNT: borinkstoragetest
  BORINK_AZURE_CONTAINER: borink-object-test

jobs:
  test:
    runs-on: ubuntu-latest
    environment: azure-live
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch

      - name: Log in to Azure
        run: |
          TOKEN=$(curl -sS --fail \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api%3A%2F%2FAzureADTokenExchange" \
            | jq -er '.value')
          echo "::add-mask::$TOKEN"
          az login --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --tenant "$AZURE_TENANT_ID" \
            --federated-token "$TOKEN"
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

      - name: Get a Storage access token
        run: |
          TOKEN=$(az account get-access-token \
            --resource https://storage.azure.com/ \
            --query accessToken -o tsv)
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "BORINK_AZURE_BEARER=$TOKEN" >> "$GITHUB_ENV"

      - run: >-
          cargo test
          --manifest-path tests/azure-get-live/Cargo.toml
          -- --ignored --test-threads=1
