name: azure-live
# This suite spends the storage account, so opening a pull request must not be
# enough to run it. The `azure-live` environment requires a reviewer: a run
# waits for that approval before it holds a token, and until then it is a
# pending check, which is what stops the merge.
#
# A pull request from a fork is given no `id-token` permission whatever the
# reviewer says, so the job fails there rather than passing untested. Push the
# branch to this repository to have it run.
on:
  workflow_dispatch:
  pull_request:
# A run waiting for its reviewer counts as in progress, so without
# `cancel-in-progress` every new run on a branch would queue behind the last
# one. With it, a new run cancels the branch's earlier run, approved or not,
# and leaves one run for the newest commit.
concurrency:
  group: azure-live-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  id-token: write
env:
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_STORAGE_CONTAINER: borink-object-test
  AZURE_BLOB_KEY: borink-object-storage/azure-get-reference/a key+é.txt
  # The write tests own this key and overwrite it on every run. It must never
  # be the read reference above, whose contents the read tests assert.
  AZURE_PUT_KEY: borink-object-storage/azure-put-scratch/a key+é.bin
  # The listing tests own everything under this prefix and empty it before
  # each test. It must not contain either key above.
  AZURE_LIST_PREFIX: borink-object-storage/azure-list-scratch/
jobs:
  # Both accounts, because the suite measures a service and the two disagree:
  # a hierarchical namespace lists the directories it keeps, folds an empty
  # path segment away, takes a quarter of the path segments, and has no
  # snapshots at all. Each leg owns its own keys on its own account, so the two
  # do not have to be serialised against one another.
  test:
    runs-on: ubuntu-latest
    environment: azure-live
    strategy:
      fail-fast: false
      matrix:
        include:
          - account: borinkstoragetest
            hierarchical: ""
          - account: borinkstoragehnstest
            hierarchical: "1"
    name: test (${{ matrix.account }})
    env:
      AZURE_STORAGE_ENDPOINT: https://${{ matrix.account }}.blob.core.windows.net
      AZURE_HIERARCHICAL: ${{ matrix.hierarchical }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      - name: Log in to Azure
        run: |
          OIDC_TOKEN="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api%3A%2F%2FAzureADTokenExchange" | jq -er .value)"
          az login --service-principal --username "$AZURE_CLIENT_ID" --tenant "$AZURE_TENANT_ID" --federated-token "$OIDC_TOKEN"
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
      - name: Test Azure live
        run: |
          TOKEN="$(az account get-access-token --resource https://storage.azure.com/ --query accessToken --output tsv)"
          echo "::add-mask::$TOKEN"
          export AZURE_STORAGE_ACCESS_TOKEN="$TOKEN"
          cargo test --locked -p azure-live -- --ignored --test-threads=1
