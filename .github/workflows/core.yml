name: core

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  format-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --all-features --no-deps

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          components: clippy
      - run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      - run: cargo test --locked --workspace --all-features
      # The Rust test harness links std and its allocator. This separate no_std
      # static library keeps the complete GET path reachable during linking.
      - name: Link without a global allocator
        run: cargo build --locked --profile no-allocator --no-default-features --features link-check --manifest-path checks/no-allocator/Cargo.toml

  cxx-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      # The development shell pins the compiler, CMake and libcurl that the
      # C++ host is built and tested against.
      - name: Check the bridge
        run: |
          nix develop --command bash -c '
            cd hosts/cxx
            cargo fmt -- --check
            cargo clippy --locked --all-targets -- -D warnings
            RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps
          '
      - name: Test the host
        run: |
          nix develop --command bash -c '
            cmake -S hosts/cxx -B hosts/cxx/build -DCMAKE_BUILD_TYPE=Debug
            cmake --build hosts/cxx/build
            ctest --test-dir hosts/cxx/build --output-on-failure
          '
