name: core

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  format-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --all-features --no-deps

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          components: clippy
      - run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
      - run: cargo test --locked --workspace --all-features
      # The Rust test harness links std and its allocator. This separate no_std
      # static library keeps the complete GET path reachable during linking.
      - name: Link without a global allocator
        run: cargo build --locked --profile no-allocator --no-default-features --features link-check --manifest-path checks/no-allocator/Cargo.toml

  # The binding itself is a workspace member, so the jobs above already
  # format, lint, document and test it. This one builds the C++ host that
  # links it, which is the only thing here that needs libcurl.
  cxx-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      # The development shell pins the compiler, CMake and libcurl that the
      # C++ host is built and tested against.
      - name: Test the host
        run: |
          nix develop --command bash -c '
            cmake -S hosts/cxx-curl -B hosts/cxx-curl/build -DCMAKE_BUILD_TYPE=Debug
            cmake --build hosts/cxx-curl/build
            ctest --test-dir hosts/cxx-curl/build --output-on-failure
          '

// review: this explanation doesn't need to be so long, most of it is obvious from the code
  # The C ABI crate is a workspace member, so the jobs above format, lint,
  # document and test it. This one builds it for the bare-metal target it also
  # serves, links a board image that has no C library at all, checks that the
  # committed header is the one cbindgen writes, runs the C program that
  # compares both compilers' idea of every struct, and installs the library to
  # a prefix and builds against it the way a packager would.
  #
  # Every C artifact here comes from cargo-c; see docs/PACKAGING.md.
  c-abi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          targets: thumbv7em-none-eabihf
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      # The development shell's rustc carries no bare-metal target, so this
      # build cannot run inside it. The pinned cargo-c goes on PATH beside the
      # toolchain above instead.
      - name: Put the pinned cargo-c on PATH
        run: echo "$(nix build --no-link --print-out-paths .#cargo-c)/bin" >> "$GITHUB_PATH"
      # No standard library, no allocator, and the target spec's `panic =
      # "abort"`. Release, because that is the archive a board flashes and the
      # one whose size the next step reports. A board has no libc, so the
      # pkg-config file beside the archive must claim no native libraries.
      - name: Build for a bare-metal board
        run: |
          cargo cbuild --locked -p borink-object-storage-c --no-default-features \
            --release --target thumbv7em-none-eabihf --library-type staticlib
          pc=target/thumbv7em-none-eabihf/release/borink-object-storage-c.pc
          cat "$pc"
          if grep -q '^Libs.private: .' "$pc"; then
            echo "the board build claims native libraries it cannot have" >&2
            exit 1
          fi
      # The header is committed and no build writes it, so this is what keeps
      # it and `src/lib.rs` from disagreeing. cbindgen comes from the pinned
      # development shell rather than from the crate's manifest.
      - name: Check the committed header
        run: |
          nix develop --command crates/object-storage-c/generate-header.sh
          git diff --exit-code crates/object-storage-c/include
      # The archive built above, linked with arm-none-eabi-gcc into an
      # image with no newlib and no heap. The header is compiled against the
      # freestanding headers alone, so a hosted-only include is a compile
      # error, and the linked image is refused if any symbol is undefined or
      # any allocator reached it. The flash and RAM it takes go to the job
      # summary.
      - name: Link a board image with no C library
        run: |
          nix develop --command crates/object-storage-c/tests/freestanding.sh \
            target/thumbv7em-none-eabihf/release/libborink_object_storage_c.a
      - name: Test the ABI from C
        run: |
          nix develop --command bash -c '
            cmake -S crates/object-storage-c -B crates/object-storage-c/build -DCMAKE_BUILD_TYPE=Debug
            cmake --build crates/object-storage-c/build
            ctest --test-dir crates/object-storage-c/build --output-on-failure
          '
      # The packaged path, which a distribution and the nix derivation take.
      # `cargo cinstall` writes a prefix, and pkg-config then says where
      # everything is. The prefix is queried somewhere other than where it was
      # installed, which is the relocation a nix store path depends on. The
      # header comparison checks that `generation = false` held.
      - name: Install to a prefix and build against it
        run: |
          nix develop --command bash -c '
            set -euo pipefail
            install=$RUNNER_TEMP/install
            cargo cinstall --locked -p borink-object-storage-c --release \
              --library-type staticlib --prefix=/usr --destdir="$install"
            find "$install" -type f

            diff -u crates/object-storage-c/include/borink/object_storage.h \
                    "$install/usr/include/borink/object_storage.h"

            moved=$RUNNER_TEMP/moved
            cp -r "$install/usr" "$moved"
            sed -i "s|^prefix=/usr$|prefix=$moved|" "$moved"/lib/*/pkgconfig/*.pc
            export PKG_CONFIG_PATH=$(dirname "$(find "$moved" -name "borink-object-storage-c.pc")")

            pkg-config --modversion borink-object-storage-c
            cc -Wall -Wextra -Wpedantic -std=c11 crates/object-storage-c/tests/abi.c \
              $(pkg-config --cflags borink-object-storage-c) \
              $(pkg-config --static --libs borink-object-storage-c) \
              -o "$RUNNER_TEMP/abi_from_prefix"
            "$RUNNER_TEMP/abi_from_prefix"
          '
      # The same packaged path, as nix takes it. The check compiles the ABI
      # test against the store path knowing only what pkg-config reported,
      # with the library a plain `buildInputs` entry.
      - name: Package the library and consume it from nix
        run: |
          nix build --no-link .#default
          nix flake check
