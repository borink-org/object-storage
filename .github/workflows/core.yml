name: core

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          components: clippy, rustfmt

      - run: cargo fmt --check
      - run: cargo fmt --check --manifest-path checks/no-allocator/Cargo.toml
      - run: cargo fmt --check --manifest-path hosts/ureq/Cargo.toml
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - run: cargo test --locked --all-features
      # The Rust test harness links std and its allocator. This separate no_std
      # static library keeps the complete GET path reachable during linking.
      - name: Link without a global allocator
        run: cargo build --locked --profile no-allocator --no-default-features --features link-check --manifest-path checks/no-allocator/Cargo.toml
      - name: Test the ureq host
        run: cargo test --locked --manifest-path hosts/ureq/Cargo.toml
      - name: Lint the ureq host
        run: cargo clippy --locked --manifest-path hosts/ureq/Cargo.toml --all-targets -- -D warnings
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --locked --all-features --no-deps
