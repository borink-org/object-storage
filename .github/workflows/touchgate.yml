# Prepares releases, checks the changelog and starts releases with
# touchgate; see docs/RELEASING.md.
name: touchgate
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, such as 0.0.4
        required: true
        type: string
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions: {}
jobs:
  touchgate:
    uses: borink-org/touchgate/.github/workflows/touchgate.yml@d7c0c14743fd542ea6b6c3cd0b7eadc1063b241c
    permissions:
      contents: write
      pull-requests: write
      actions: write
    with:
      version: ${{ inputs.version }}
