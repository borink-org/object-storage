[package]
name = "borink-azure-get-ureq"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
borink-object-storage = { path = "../.." }
# `default-features = false` drops ureq's `gzip` and `brotli` features. They
# decode the response body and remove the headers that record it, which would
# contradict the byte offsets and lengths that this crate reads from the head.
ureq = { version = "3.1", default-features = false, features = ["rustls"] }

[lints.rust]
missing_docs = "deny"
