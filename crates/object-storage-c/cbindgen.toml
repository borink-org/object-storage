# The C header is generated from `src/lib.rs` rather than written beside it, so
# the two declarations of every struct cannot drift apart.

language = "C"
# `usize` is `size_t`, which is what a C program spells it.
usize_is_size_t = true
# The three headers this one uses, rather than cbindgen's default list. All
# three are freestanding, so a board supplies them without a libc.
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
# The same header serves a C++ program.
cpp_compat = true
include_guard = "BORINK_OBJECT_STORAGE_H"
tab_width = 4
documentation_style = "doxy"
header = """
// Azure Blob Storage for a program that owns its memory and its I/O.
//
// GENERATED by cbindgen from crates/object-storage-c/src/lib.rs. Do not edit.
// Edit the Rust source and build the crate; CI fails if this file and that
// source disagree."""

[export]
prefix = ""
include = [
    "AzureNamespace",
    "ErrorCode",
    "Method",
    "GetKind",
    "Ranging",
    "RevisionKind",
    "RangeForm",
    "Condition",
    "ConditionForm",
    "ChecksumKind",
    "BlockSource",
    "ListInclude",
    "FailureClass",
    "ServiceError",
    "OutcomeKind",
    "EntryKind",
    "BlobProperty",
]
renaming_overrides_prefixing = true

# Rust spells a type in camel case and C spells it in snake case. Every type
# that crosses is listed, so a new one is named here on purpose.
[export.rename]
"Bytes" = "borink_bytes"
"BytesMut" = "borink_bytes_mut"
"Span" = "borink_span"
"MaybeBytes" = "borink_maybe_bytes"
"MaybeU64" = "borink_maybe_u64"
"MaybeU32" = "borink_maybe_u32"
"Status" = "borink_status"
"AzureNamespace" = "borink_azure_namespace"
"AzureRejection" = "borink_azure_rejection"
"Container" = "borink_container"
"TIMESTAMPS_LEN" = "BORINK_TIMESTAMPS_LEN"
"Timestamps" = "borink_timestamps"
"TEMPLATE_LEN" = "BORINK_TEMPLATE_LEN"
"Template" = "borink_template"
"Prepared" = "borink_prepared"
"ConditionValue" = "borink_condition_value"
"Range" = "borink_range"
"GetOptions" = "borink_get_options"
"GetItem" = "borink_get_item"
"GetShape" = "borink_get_shape"
"ContentProperties" = "borink_content_properties"
"WriteOptions" = "borink_write_options"
"PutOptions" = "borink_put_options"
"PutItem" = "borink_put_item"
"PutShape" = "borink_put_shape"
"StageOptions" = "borink_stage_options"
"StageBlockItem" = "borink_stage_block_item"
"CommitOptions" = "borink_commit_options"
"BlockRef" = "borink_block_ref"
"CommitItem" = "borink_commit_item"
"CommitShape" = "borink_commit_shape"
"ListOptions" = "borink_list_options"
"ListItem" = "borink_list_item"
"WireRequest" = "borink_wire_request"
"Header" = "borink_header"
"MaybeSpan" = "borink_maybe_span"
"ListEntry" = "borink_list_entry"
"Properties" = "borink_properties"
"Property" = "borink_property"
"Fill" = "borink_fill"
"PropertySet" = "borink_property_set"
"HeaderRef" = "borink_header_ref"
"ObjectMeta" = "borink_object_meta"
"BodyWindow" = "borink_body_window"
"Failure" = "borink_failure"
"Outcome" = "borink_outcome"
"Layout" = "borink_layout"
"ErrorCode" = "borink_error_code"
"Method" = "borink_method"
"GetKind" = "borink_get_kind"
"Ranging" = "borink_ranging"
"RevisionKind" = "borink_revision_kind"
"RangeForm" = "borink_range_form"
"Condition" = "borink_condition"
"ConditionForm" = "borink_condition_form"
"ChecksumKind" = "borink_checksum_kind"
"BlockSource" = "borink_block_source"
"ListInclude" = "borink_list_include"
"FailureClass" = "borink_failure_class"
"ServiceError" = "borink_service_error"
"OutcomeKind" = "borink_outcome_kind"
"EntryKind" = "borink_entry_kind"
"BlobProperty" = "borink_blob_property"
# `class` and `template` are C++ keywords.
"class" = "class_"
"template" = "template_"

# A variant is named after its type, so a C consumer reads
# `BORINK_GET_KIND_BYTES` without a second table.
[enum]
rename_variants = "QualifiedScreamingSnakeCase"

[parse]
parse_deps = false
