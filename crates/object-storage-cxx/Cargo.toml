[package]
name = "borink-object-storage-cxx"
version = "0.0.0"
edition = "2024"
publish = false

# The staticlib is what a C++ program links; the rlib is what another Rust
# crate depends on. `cargo build` writes both, and the generated header that
# declares the bridge, into the workspace's `target/`.
[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
borink-object-storage-proto = { path = "../../crates/object-storage-proto" }
cxx = "1.0"

[build-dependencies]
cxx-build = "1.0"

[lints.rust]
missing_docs = "deny"
