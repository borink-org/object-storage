[package]
name = "borink-object-storage-proto"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
description = "Object storage operations with a sans-IO core and externally buffered API"
repository = "https://github.com/borink-org/object-storage"
readme = "../../README.md"

[dependencies]

[lints.rust]
missing_docs = "deny"

# The recorded Azure responses under `tests/fixtures` are read through the
# format their recorder writes them in, which `tests/support` spells once.
# A path-only dev-dependency is left out of the published crate.
[dev-dependencies]
test-support = { path = "../../tests/support" }
