[package]
name = "borink-object-storage-proto"
version = "0.0.4"
edition = "2024"
license = "Apache-2.0"
description = "Builds Azure Blob Storage and S3 requests and reads their responses, without I/O or allocation"
repository = "https://github.com/borink-org/object-storage"
readme = "../../README.md"
rust-version = "1.97"
keywords = ["azure", "s3", "object-storage", "sans-io", "no-std"]
categories = ["no-std::no-alloc", "api-bindings", "network-programming"]

[dependencies]

[lints.rust]
missing_docs = "deny"

[features]
# Writes every request by walking its template's table, one function for
# every operation, in place of the code that each operation's layout
# compiles to: less code, for a target where size matters more than speed.
compact = []
