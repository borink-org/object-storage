# A virtual workspace. `crates/` holds what a consumer depends on; `hosts/`
# holds programs that drive one of those crates with a real HTTP client.
[workspace]
members = ["crates/*", "checks/no-allocator", "hosts/ureq", "tests/azure-live"]
default-members = ["crates/object-storage-proto"]
# The C++ hosts need libcurl, Boost and OpenSSL, which `flake.nix` provides.
# They are their own workspace so that a checkout without those libraries
# still builds and tests everything else.
exclude = ["hosts/cxx"]

[profile.no-allocator]
inherits = "dev"
panic = "abort"
