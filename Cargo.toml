[workspace]
members = ["checks/no-allocator", "hosts/ureq", "tests/azure-get-live"]
default-members = ["."]

[package]
name = "borink-object-storage"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
description = "Object storage operations with a sans-IO core and externally buffered API"
repository = "https://github.com/borink-org/object-storage"
readme = "README.md"

[dependencies]
percent-encoding = { version = "2.3", default-features = false }
xmlparser = { version = "0.13", default-features = false }

[lints.rust]
missing_docs = "deny"

[profile.no-allocator]
inherits = "dev"
panic = "abort"
